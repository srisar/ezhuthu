[workspace]
resolver = "3"
members = ["crates/xlit", "crates/app", "crates/install", "crates/setup"]

[workspace.package]
edition = "2024"
version = "0.3.1"
publish = false
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimized but quick to link, for dev iterations (`--profile fast`). Debug
# assertions keep the console window and the workspace assets/ fallback.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true
