[workspace]
resolver = "3"
members = ["crates/app","crates/xlit"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimized but quick to link, for benchmarking iterations (`--profile fast`).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
