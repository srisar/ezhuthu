[package]
name = "ezhuthu"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
ezhuthu-install = { version = "0.2.0", path = "../install" }
ezhuthu-xlit = { version = "0.2.0", path = "../xlit" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_TextServices", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Registry", "Win32_Graphics_Dwm"] }
