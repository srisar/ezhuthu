[project]
name = "ezhuthu-export"
version = "0.1.0"
description = "One-time export of the IndicXlit fairseq checkpoint to ONNX for ezhuthu (never shipped)"
requires-python = "==3.10.*"
dependencies = [
    "numpy>=2.2.6",
    "onnx>=1.23.2",
    "onnxruntime>=1.23.2",
    "torch>=2.14.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
